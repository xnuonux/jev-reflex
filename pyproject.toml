[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-reflex"
version = "0.6.0"
description = "Accounted, source-bound Jev decision support for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Eternities"}]
dependencies = []
keywords = ["jev", "mcp", "agents", "coding", "typesafe"]

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2", "pydantic>=2.12,<3"]

[project.scripts]
jev-reflex = "jev_reflex.cli:main"

[project.urls]
Homepage = "https://github.com/xnuonux/jev-reflex"
Issues = "https://github.com/xnuonux/jev-reflex/issues"

[tool.setuptools.packages.find]
where = ["src"]
