name: Contract tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --only-binary=:all: setuptools wheel build "mcp>=1.30,<2" "pydantic>=2.12,<3"
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python -m unittest discover -s tests -v
      - run: node --test adapters/pi/bridge.test.mjs
      - run: jev-reflex demo
      - run: python tools/verify_installed.py
      - run: python -m build --no-isolation
